<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meteor Projectile</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: black;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- Three.js + GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      /**
       * Realistic projectile motion (parabola)
       * @param {THREE.Mesh} sphere - the meteor mesh
       * @param {THREE.Vector3} start - starting point
       * @param {THREE.Vector3} end - ending point
       * @param {number} speed - units per second
       * @param {number} height - peak height above the straight line
       */
      function projectileMotion(sphere, start, end, speed = 5, height = 5) {
        sphere.position.copy(start);

        const distance = start.distanceTo(end);
        const duration = distance / speed;

        const tempVec = new THREE.Vector3();

        gsap.to(
          { t: 0 },
          {
            t: 1,
            duration: duration,
            ease: "none", // linear progress
            onUpdate: function () {
              const t = this.targets()[0].t;

              // Linear interpolation in X/Z
              tempVec.lerpVectors(start, end, t);

              // Parabola for Y
              const parabola = 4 * height * t * (1 - t); // normalized parabola (0→1)
              tempVec.y = THREE.MathUtils.lerp(start.y, end.y, t) + parabola;

              sphere.position.copy(tempVec);
            },
          }
        );
      }

      // 🟠 Three.js setup
      let scene, camera, renderer, meteor;

      init();
      animate();

      function init() {
        // Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Camera
        camera = new THREE.PerspectiveCamera(
          60,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.set(0, 5, 20);

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambient = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambient);

        const pointLight = new THREE.PointLight(0xff6600, 2, 50);
        pointLight.position.set(0, 10, 10);
        scene.add(pointLight);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1;
        scene.add(ground);

        // Meteor
        const geometry = new THREE.SphereGeometry(0.5, 32, 32);
        const material = new THREE.MeshStandardMaterial({
          color: 0xff5500,
          emissive: 0xff2200,
          emissiveIntensity: 1,
          roughness: 0.3,
          metalness: 0.1,
        });
        meteor = new THREE.Mesh(geometry, material);
        scene.add(meteor);

        // Start & End
        const start = new THREE.Vector3(-10, 0, 0);
        const end = new THREE.Vector3(10, 0, -5);

        // Animate with parabola trajectory
        projectileMotion(meteor, start, end, 5, 20);

        // Resize
        window.addEventListener("resize", onWindowResize, false);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
